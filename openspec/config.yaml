schema: spec-driven

context: |
	The purpose of this project is to be presented during a job interview at a company that
	specializes in the research and development of medical devices. I was not asked to do this
	project, rather, I decided to create this as a potential talking point and showcase item.

	The job is for a summer internship position as a software engineer. The projects available
	for me to work on will involve the following topics:
	- Data
	- AI/ML
	- CI/CD
	- Automation

	I am aware the team utilizes Azure DevOps for their CI/CD pipelines. That said, this project
	will utilize Azure DevOps. I am aware that the team will have projects involving the reception
	of data and using AI/ML to analyze that data. That said, we will generate synthetic data and
	use AI/ML to analyze it and draw conclusions from it. As this project also involves automation,
	we will create a MLOps pipeline that takes new incoming data, feeds it through model training,
	perform model evaluation, then update the dashboard with the latest results. This pipeline will
	be automated to run on a regular basis, ensuring that the dashboard always reflects the most
	current analysis of the data.

	As this is a small project, we will not have to worry about scaling or distributed computing.
	We will focus on creating a simple, end-to-end pipeline that demonstrates the key concepts of
	data processing, AI/ML model training and evaluation, and CI/CD automation.

	For our data, we will generate synthetic data that simulates collected telemetry data from
	pacemakers. The data will have at least approximately 2,000,000 data points. Each data point
	includes:
	- Patient_ID (int value, example: 0, 1, 2, etc.): The model ignores this during training. It
		serves primarily as a unique identifier for the patient to maintain data grouping and for
		future additions to the dataset.
	- Timestamp (unix timestamp, example: 1772004834): The model ignores this during training.
		It serves primarily as a unique identifier for when the data was collected and ensures the
		data maintains strict chronological order for time-series analysis.
	- Lead_Impedance_Ohms (float value up to 2 decimal points, example: 500.00, 501.22, 1750.90, etc.):
		The resistance of the wire lead in a pacemaker. Normal values hover around 500 Ohms. An
		upward drift indicates a developing physical lead fracture or degradation.
	- Capture_Threshold_V (float value up to 2 decimal points, example: 0.67, 0.65, 2.10, etc.):
		The minimum voltage required to stimulate the heart to beat. Normal values are around 0.70V.
		A steady rise indicates the lead is losing effective contact with the heart tissue.
	- R_Wave_Sensing_mV (float value up to 2 decimal points, example: 12.24, 11.80, 4.50, etc.):
		The voltage of the R wave sensed by the pacemaker, which indicates how well the pacemaker
		detects the heart's natural electrical activity. Normal values are around 12.00mV.
	- Battery_Voltage_V (float value up to 2 decimal points, example: 2.95, 2.85, 2.30, etc.):
		The voltage of the pacemaker's battery, which indicates the remaining battery life and overall
		health of the device. Normal healthy values start around 2.95V, while drops below 2.60V
		indicate critical depletion.
	- Target_Fail_Next_7d (boolean value 0 or 1, example: 0 for normal, 1 for danger zone): Not
		collected in telemetry data, but engineered using manual clinical logs to act as the target
		variable for our AI/ML model. A value of 1 indicates that the pacemaker is actively degrading
		and is predicted to experience a hard failure within the next 7 days. A value of 0 indicates
		normal operation or early, non-critical drift.

	Once data is generated by generate_data.py, we will use it to train a simple ML model with a
	random forest algorithm. This model will be trained to predict the Target_Fail_Next_7d variable
	based on the other features in the dataset. In this stage, we will perform data preprocessing,
	feature engineering, and model training. We will also use techniques such as cross-validation to
	ensure that our model is robust and generalizes well to unseen data. Once trained, we will save
  the model for later use. Once the entire system is integrated into the MLOps pipeline, the model
  will be retrained on a regular basis with new incoming data to ensure it remains up-to-date/accurate.

	When models are trained, we will evaluate the model's performance and later create a web app
  serving as our unified application. The backend will be build with FastAPI, which will recieve 
  data from an endpoint, add that data to our dataset, retrain the model, evaluate it, derive metrics,
  push that model out for deployment, then update a React dashboard with the latest metrics and 
  predictions. The dashboard will display key performance metrics of the model, such as accuracy, 
  precision, recall, and F1 score. It will also display data for the most recent predictions of whose
  pacemakers are in the danger zone, allowing for easy monitoring of patients at risk and demonstrating
  the practical application of our AI/ML model in a real-world healthcare scenario.

	Finally, we will set up a CI/CD pipeline in Azure DevOps to automate the entire process from
	data generation to model training and dashboard updating. Our Azure DevOps will include of course
  core CI/CD pipelines for building and testing our code, but also a scheduled pipeline that runs the 
  entire MLOps process on a regular basis (e.g., daily or weekly) to ensure that our model and dashboard
  are always up-to-date with the latest data and analysis.
